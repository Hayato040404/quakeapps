<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地震情報アプリ</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/ewc.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/ewc.png">
    <style>
        :root {
            --system-blue: #007AFF;
            --system-red: #FF3B30;
            --system-green: #34C759;
            --system-orange: #FF9500;
            --system-gray: #8E8E93;
            --background: #F2F2F7;
            --card-background: #FFFFFF;
            --text-primary: #000000;
            --text-secondary: #6C6C70;
            --divider: rgba(60, 60, 67, 0.1);
            --shadow: rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #000000;
                --card-background: #1C1C1E;
                --text-primary: #FFFFFF;
                --text-secondary: #98989E;
                --divider: rgba(84, 84, 88, 0.65);
                --shadow: rgba(0, 0, 0, 0.3);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        header {
            width: 100%;
            background-color: var(--card-background);
            color: var(--text-primary);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 1px 3px var(--shadow);
            border-bottom: 1px solid var(--divider);
        }

        header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--system-blue);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
        }

        button:hover {
            background-color: #005bb5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .scroll-button {
            background-color: var(--system-orange);
            box-shadow: 0 2px 8px rgba(255, 149, 0, 0.3);
        }

        .scroll-button:hover {
            background-color: #e6850e;
            box-shadow: 0 4px 12px rgba(255, 149, 0, 0.4);
        }

        main {
            width: 100%;
            max-width: 900px;
            margin: 20px;
            padding: 0 20px;
        }

        .info-section {
            margin: 20px 0;
            padding: 20px;
            background-color: var(--card-background);
            box-shadow: 0 2px 12px var(--shadow);
            border-radius: 16px;
            border: 1px solid var(--divider);
            position: relative;
            overflow: hidden;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--divider);
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .tap-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--system-blue);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .earthquake-item, .eew-item {
            margin: 15px 0;
            padding: 20px;
            border: 1px solid var(--divider);
            border-radius: 12px;
            background-color: var(--background);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .earthquake-item:hover, .eew-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--shadow);
            border-color: var(--system-blue);
        }

        .earthquake-item:active, .eew-item:active {
            transform: translateY(0);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(0, 122, 255, 0.3);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .earthquake-summary {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .earthquake-details {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .expanded-content {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--divider);
        }

        .expanded-content.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        textarea {
            width: 100%;
            height: 120px;
            margin-top: 15px;
            padding: 12px;
            border: 1px solid var(--divider);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            background-color: var(--card-background);
            color: var(--text-primary);
            resize: vertical;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--system-blue);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        .share-button {
            margin-top: 10px;
            background-color: var(--system-green);
            font-size: 14px;
            padding: 8px 16px;
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.3);
        }

        .share-button:hover {
            background-color: #28a745;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.4);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 16px;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--divider);
            border-radius: 50%;
            border-top-color: var(--system-blue);
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 自動通知許可モーダル */
        .notification-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .notification-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--card-background);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .notification-modal.show .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .modal-description {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-button {
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-button.primary {
            background-color: var(--system-blue);
            color: white;
            border: none;
        }

        .modal-button.secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--divider);
        }

        .admin-message {
            margin: 20px;
            padding: 15px 20px;
            border-radius: 12px;
            border-left: 4px solid var(--system-blue);
            background-color: rgba(0, 122, 255, 0.1);
            animation: slideIn 0.5s ease;
        }

        .admin-message.warning {
            border-left-color: var(--system-orange);
            background-color: rgba(255, 149, 0, 0.1);
        }

        .admin-message.error {
            border-left-color: var(--system-red);
            background-color: rgba(255, 59, 48, 0.1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }

            header h1 {
                font-size: 24px;
            }

            header p {
                font-size: 14px;
            }

            button {
                font-size: 14px;
                padding: 10px 16px;
            }

            main {
                margin: 15px;
                padding: 0 15px;
            }

            .info-section {
                padding: 15px;
                margin: 15px 0;
            }

            .section-title {
                font-size: 18px;
            }

            .modal-content {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <!-- 自動通知許可モーダル -->
    <div id="notificationModal" class="notification-modal">
        <div class="modal-content">
            <div class="modal-icon">🔔</div>
            <h2 class="modal-title">地震情報の通知を受け取りますか？</h2>
            <p class="modal-description">
                緊急地震速報や地震情報をリアルタイムで通知します。<br>
                いつでも設定から変更できます。
            </p>
            <div class="modal-buttons">
                <button class="modal-button primary" id="allowNotifications">許可する</button>
                <button class="modal-button secondary" id="denyNotifications">後で</button>
            </div>
        </div>
    </div>

    <!-- 管理者メッセージ表示エリア -->
    <div id="adminMessageContainer"></div>

    <header>
        <h1>地震情報アプリ</h1>
        <p>リアルタイムで地震情報と緊急地震速報をお届けします</p>
        <div class="button-group">
            <button id="subscribeButton">通知を許可</button>
            <button id="testNotificationButton">テスト通知</button>
            <button class="scroll-button" onclick="scrollToEewSection()">緊急地震速報へ</button>
        </div>
    </header>

    <main>
        <div class="info-section">
            <div class="section-header">
                <h2 class="section-title">最新の地震情報</h2>
                <div class="tap-hint">
                    <div class="pulse-dot"></div>
                    タップして詳細を表示
                </div>
            </div>
            <div id="earthquakeInfo" class="loading">地震情報を取得中...</div>
        </div>

        <div class="info-section" id="eewSection">
            <div class="section-header">
                <h2 class="section-title">緊急地震速報</h2>
                <div class="tap-hint">
                    <div class="pulse-dot"></div>
                    タップして詳細を表示
                </div>
            </div>
            <div id="eewInfo" class="loading">緊急地震速報を取得中...</div>
        </div>
    </main>

    <script>
        const publicVapidKey = 'BC1T1-o4f9vLJ11ngQXOZTdKY8xd38vUyWeWyPosJ7JDJxnCPrAGtJZE_CUW4dqdh60eEUf5G-qzWjaojsSMer0';

        // ページ読み込み時に初回アクセスチェックと自動通知許可
        document.addEventListener('DOMContentLoaded', async () => {
            await checkFirstAccessAndAutoSubscribe();
            await fetchAdminMessage();
            fetchEarthquakeInfo();
            fetchEewInfo();
        });

        // 初回アクセスチェックと自動通知許可
        async function checkFirstAccessAndAutoSubscribe() {
            try {
                const response = await fetch('/api/first-access');
                const data = await response.json();
                
                console.log('First access check:', data);
                
                if (data.isFirstAccess && data.autoSubscriptionEnabled) {
                    console.log('First access detected, showing notification modal');
                    showNotificationModal();
                }
            } catch (error) {
                console.error('Error checking first access:', error);
            }
        }

        // 通知許可モーダルを表示
        function showNotificationModal() {
            const modal = document.getElementById('notificationModal');
            modal.classList.add('show');
            
            // 許可ボタンのイベントリスナー
            document.getElementById('allowNotifications').addEventListener('click', async () => {
                modal.classList.remove('show');
                await subscribe();
            });
            
            // 後でボタンのイベントリスナー
            document.getElementById('denyNotifications').addEventListener('click', () => {
                modal.classList.remove('show');
            });
        }

        // 管理者メッセージを取得して表示
        async function fetchAdminMessage() {
            try {
                const response = await fetch('/api/admin-message');
                const messageData = await response.json();
                
                if (messageData.isVisible && messageData.text) {
                    displayAdminMessage(messageData);
                }
            } catch (error) {
                console.error('Error fetching admin message:', error);
            }
        }

        // 管理者メッセージを表示
        function displayAdminMessage(messageData) {
            const container = document.getElementById('adminMessageContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `admin-message ${messageData.type || 'info'}`;
            messageDiv.innerHTML = `
                <div style="font-weight: 500; margin-bottom: 5px;">📢 お知らせ</div>
                <div>${messageData.text}</div>
            `;
            container.appendChild(messageDiv);
        }

        async function subscribe() {
            try {
                if ('serviceWorker' in navigator) {
                    console.log('Registering service worker...');
                    const registration = await navigator.serviceWorker.register('/service-worker.js');
                    
                    console.log('Requesting notification permission...');
                    const permission = await Notification.requestPermission();
                    
                    if (permission === 'granted') {
                        console.log('Notification permission granted, subscribing to push...');
                        const subscription = await registration.pushManager.subscribe({
                            userVisibleOnly: true,
                            applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                        });

                        console.log('Sending subscription to server...');
                        const response = await fetch('/subscribe', {
                            method: 'POST',
                            body: JSON.stringify(subscription),
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });

                        if (response.ok) {
                            alert('通知が許可されました！');
                            console.log('Subscription successful');
                        } else {
                            throw new Error('Failed to send subscription to server');
                        }
                    } else {
                        alert('通知の許可が必要です。ブラウザの設定から許可してください。');
                    }
                } else {
                    alert('このブラウザはプッシュ通知をサポートしていません。');
                }
            } catch (error) {
                console.error('Subscription error:', error);
                alert('通知の設定中にエラーが発生しました。');
            }
        }

        async function sendTestNotification() {
            try {
                const response = await fetch('/test-notification', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    alert('テスト通知を送信しました！');
                } else {
                    alert('テスト通知の送信に失敗しました。');
                }
            } catch (error) {
                console.error('Test notification error:', error);
                alert('テスト通知の送信中にエラーが発生しました。');
            }
        }

        document.getElementById('subscribeButton').addEventListener('click', subscribe);
        document.getElementById('testNotificationButton').addEventListener('click', sendTestNotification);

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);

            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        // リップル効果を作成
        function createRipple(event, element) {
            const ripple = document.createElement('span');
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('ripple');
            
            element.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        async function fetchEarthquakeInfo() {
            try {
                const response = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=5');
                const data = await response.json();
                displayEarthquakeInfo(data);
            } catch (error) {
                console.error('Error fetching earthquake information:', error);
                document.getElementById('earthquakeInfo').innerHTML = '<p>地震情報の取得に失敗しました</p>';
            }
        }

        async function fetchEewInfo() {
            try {
                const response = await fetch('https://api.wolfx.jp/jma_eew.json');
                const data = await response.json();
                displayEewInfo(data);
            } catch (error) {
                console.error('Error fetching EEW information:', error);
                document.getElementById('eewInfo').innerHTML = '<p>緊急地震速報の取得に失敗しました</p>';
            }
        }

        function displayEarthquakeInfo(earthquakes) {
            const container = document.getElementById('earthquakeInfo');
            container.innerHTML = '';
            
            if (!earthquakes || earthquakes.length === 0) {
                container.innerHTML = '<p>現在、地震情報はありません</p>';
                return;
            }

            earthquakes.forEach((earthquake, index) => {
                const time = new Date(earthquake.earthquake.time);
                const date = time.toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit' });
                const timeStr = time.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

                const hypocenter = earthquake.earthquake.hypocenter.name;
                const maxScale = getScaleDescription(earthquake.earthquake.maxScale);
                let magnitude = earthquake.earthquake.hypocenter.magnitude;
                let depth = earthquake.earthquake.hypocenter.depth;

                depth = depth === -1 ? '不明' : depth === 0 ? 'ごく浅い' : `約${depth}km`;
                magnitude = magnitude === -1 ? '不明' : magnitude.toFixed(1);

                const pointsByScale = groupPointsByScale(earthquake.points);
                const tsunamiInfo = getTsunamiInfo(earthquake.earthquake.domesticTsunami);
                const freeFormComment = earthquake.comments?.freeFormComment || '';

                let formattedMessage;

                if (earthquake.issue && earthquake.issue.type === 'ScalePrompt') {
                    formattedMessage = `[震度速報]\n${date} ${timeStr}ごろ、地震による強い揺れを感じました。震度３以上が観測された地域をお知らせします。\n`;

                    Object.keys(pointsByScale).sort((a, b) => b - a).forEach(scale => {
                        formattedMessage += `\n《震度${scale}》`;
                        Object.keys(pointsByScale[scale]).forEach(pref => {
                            formattedMessage += `\n【${pref}】${pointsByScale[scale][pref].join('  ')}`;
                        });
                    });
                } else {
                    formattedMessage = `[地震情報]\n${date} ${timeStr}頃\n震源地：${hypocenter}\n最大震度：${maxScale}\n深さ：${depth}\n規模：M${magnitude}\n${tsunamiInfo}\n\n［各地の震度］`;

                    const scaleOrder = ['7', '6強', '6弱', '5強', '5弱','5弱以上と推定されるが震度情報を入手していない', '4', '3', '2', '1'];
                    const sortedScales = Object.keys(pointsByScale).sort((a, b) => {
                        return scaleOrder.indexOf(a) - scaleOrder.indexOf(b);
                    });

                    sortedScales.forEach(scale => {
                        formattedMessage += `\n《震度${scale}》`;
                        Object.keys(pointsByScale[scale]).forEach(pref => {
                            const uniqueCities = new Set();
                            pointsByScale[scale][pref].forEach(addr => {
                                const cityMatch = addr.match(/([^市区町村]+[市区町村])/);
                                if (cityMatch) {
                                    uniqueCities.add(cityMatch[1]);
                                }
                            });
                            formattedMessage += `\n【${pref}】${Array.from(uniqueCities).join('  ')}`;
                        });
                    });

                    if (freeFormComment) {
                        formattedMessage += `\n\n【情報】\n${freeFormComment}`;
                    }
                }

                const earthquakeItem = document.createElement('div');
                earthquakeItem.className = 'earthquake-item';
                earthquakeItem.innerHTML = `
                    <div class="earthquake-summary">
                        ${date} ${timeStr} - ${hypocenter} (最大震度${maxScale})
                    </div>
                    <div class="earthquake-details">
                        規模: M${magnitude} | 深さ: ${depth}
                    </div>
                    <div class="expanded-content" id="expanded${index}">
                        <p>${formattedMessage.replace(/\n/g, '<br>')}</p>
                        <textarea id="editedMessage${index}" placeholder="通知メッセージを編集">${formattedMessage}</textarea>
                        <button class="share-button" onclick="shareEditedMessage(${index})">編集したメッセージを共有</button>
                    </div>
                `;

                earthquakeItem.addEventListener('click', (e) => {
                    createRipple(e, earthquakeItem);
                    const expanded = document.getElementById(`expanded${index}`);
                    expanded.classList.toggle('show');
                });

                container.appendChild(earthquakeItem);
            });
        }

        function displayEewInfo(data) {
            const container = document.getElementById('eewInfo');
            container.innerHTML = '';
            
            if (data.Title && data.CodeType) {
                let formattedMessage;
                if (data.isCancel) {
                    formattedMessage = "先程の緊急地震速報は取り消されました。";
                } else {
                    formattedMessage = formatEewMessage(data);
                    if (data.isAssumption) {
                        formattedMessage += "\n※この緊急地震速報は精度が低い可能性があります※";
                    }
                }

                const eewItem = document.createElement('div');
                eewItem.className = 'eew-item';
                eewItem.innerHTML = `
                    <div class="earthquake-summary">
                        ${data.Title} - 推定最大震度${data.MaxIntensity} (第${data.Serial}報)
                    </div>
                    <div class="earthquake-details">
                        震源: ${data.Hypocenter} | 規模: M${data.Magunitude} | 深さ: 約${data.Depth}km
                    </div>
                    <div class="expanded-content" id="expandedEew">
                        <p>${formattedMessage.replace(/\n/g, '<br>')}</p>
                        <textarea id="editedEewMessage" placeholder="通知メッセージを編集">${formattedMessage}</textarea>
                        <button class="share-button" onclick="shareEditedEewMessage()">編集したメッセージを共有</button>
                    </div>
                `;

                eewItem.addEventListener('click', (e) => {
                    createRipple(e, eewItem);
                    const expanded = document.getElementById('expandedEew');
                    expanded.classList.toggle('show');
                });

                container.appendChild(eewItem);
            } else {
                container.innerHTML = '<p>現在、緊急地震速報の発表はありません</p>';
            }
        }

        function formatEewMessage(data) {
            return `【${data.Title} 推定最大震度${data.MaxIntensity}】\n(第${data.Serial}報)\n${data.OriginTime.split(' ')[1]}頃、${data.Hypocenter}を震源とする地震がありました。地震の規模はM${data.Magunitude}程度、震源の深さは約${data.Depth}km、最大震度${data.MaxIntensity}程度と推定されています。`;
        }

        function getScaleDescription(scale) {
            const scaleDescriptions = {
                10: '1',
                20: '2',
                30: '3',
                40: '4',
                45: '5弱',
                46: '5弱以上と推定されるが震度情報を入手していない',
                50: '5強',
                55: '6弱',
                60: '6強',
                70: '7'
            };
            return scaleDescriptions[scale] || '不明';
        }

        function groupPointsByScale(points) {
            const pointsByScale = {};
            points.forEach(point => {
                const scale = getScaleDescription(point.scale);
                const addr = point.addr;
                const prefecture = point.pref;

                if (!scale) return;

                pointsByScale[scale] = pointsByScale[scale] || {};
                pointsByScale[scale][prefecture] = pointsByScale[scale][prefecture] || [];
                pointsByScale[scale][prefecture].push(addr);
            });
            return pointsByScale;
        }

        function getTsunamiInfo(domesticTsunami) {
            const tsunamiMessages = {
                "None": "この地震による津波の心配はありません。",
                "Unknown": "不明",
                "Checking": "津波の有無を調査中です。今後の情報に注意してください。",
                "NonEffective": "若干の海面変動があるかもしれませんが、被害の心配はありません。",
                "Watch": "現在、津波注意報を発表中です。",
                "Warning": "津波警報等（大津波警報・津波警報あるいは津波注意報）を発表中です。"
            };
            return tsunamiMessages[domesticTsunami] || "（津波情報なし）";
        }

        function shareEditedMessage(index) {
            const editedMessage = document.getElementById(`editedMessage${index}`).value;
            if (navigator.share) {
                navigator.share({
                    title: '地震情報',
                    text: editedMessage
                }).catch(console.error);
            } else {
                alert('このブラウザは共有機能をサポートしていません。');
            }
        }

        function shareEditedEewMessage() {
            const editedMessage = document.getElementById('editedEewMessage').value;
            if (navigator.share) {
                navigator.share({
                    title: '緊急地震速報',
                    text: editedMessage
                }).catch(console.error);
            } else {
                alert('このブラウザは共有機能をサポートしていません。');
            }
        }

        function scrollToEewSection() {
            const eewSection = document.getElementById('eewSection');
            eewSection.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
